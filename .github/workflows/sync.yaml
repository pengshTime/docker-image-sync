name: Sync Docker Images

on:
  workflow_dispatch:
    inputs:
      image_list_file:
        description: 'Path to the image list file'
        required: true
        default: 'images.txt'

env:
  IMAGE_LIST_FILE: ${{ github.event.inputs.image_list_file || 'images.txt' }}
  LOG_LEVEL: ${{ vars.LOG_LEVEL }}
  SYNC_TIMEOUT: ${{ vars.SYNC_TIMEOUT }}
  MAX_RETRIES: ${{ vars.MAX_RETRIES }}
  CONCURRENCY: ${{ vars.CONCURRENCY }}
  PREFERRED_ARCH: ${{ vars.PREFERRED_ARCH }}

# 同一时间只跑一个同步，避免两次触发互抢
concurrency:
  group: sync
  cancel-in-progress: false

jobs:
  sync-aliyun:
    name: Sync to Aliyun
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.21'

      - name: Install skopeo
        run: |
          curl -sL https://github.com/lework/skopeo-binary/releases/download/v1.14.2/skopeo-linux-amd64 -o /usr/local/bin/skopeo
          chmod +x /usr/local/bin/skopeo
          skopeo --version

      - name: Test
        run: go test ./...

      - name: Build
        run: |
          BUILD_TIME=$(date +%Y-%m-%d_%H:%M:%S)
          go build -ldflags "-X main.BuildTime=$BUILD_TIME" -o sync ./cmd/sync

      - name: Run sync
        env:
          PROVIDER: aliyun
          ALIYUN_REGISTRY: ${{ secrets.ALIYUN_REGISTRY }}
          ALIYUN_NAMESPACE: ${{ secrets.ALIYUN_NAME_SPACE }}
          ALIYUN_REGISTRY_USER: ${{ secrets.ALIYUN_REGISTRY_USER }}
          ALIYUN_REGISTRY_PASSWORD: ${{ secrets.ALIYUN_REGISTRY_PASSWORD }}
        run: ./sync

      - name: Delete Old Workflow Runs
        if: always()
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "Fetching workflow runs..."
          # 保留最近 5 次历史（不含当前这次），更早的清掉
          current_run_id=${{ github.run_id }}
          runs=$(curl -s -H "Authorization: token $GITHUB_TOKEN" \
            "https://api.github.com/repos/${{ github.repository }}/actions/runs?per_page=100" | \
            jq -r ".workflow_runs | map(select(.id != $current_run_id)) | .[5:][] | .id")

          # 删除超出保留数量的旧记录
          count=0
          for run_id in $runs; do
            echo "Deleting run $run_id..."
            curl -s -X DELETE -H "Authorization: token $GITHUB_TOKEN" \
              "https://api.github.com/repos/${{ github.repository }}/actions/runs/$run_id"
            count=$((count + 1))
          done

          echo "Deleted $count old workflow runs, keeping the 5 most recent plus current run ($current_run_id)"
